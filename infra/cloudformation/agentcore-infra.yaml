  #
  # KbPoliciesBucket:
  #   Type: AWS::S3::Bucket
  #   Properties:
  #     BucketName: !Sub "${AppName}-kb-policies-${AWS::AccountId}"
  #
  # KbServiceRole:
  #   Type: AWS::IAM::Role
  #   Properties:
  #     RoleName: !Sub "${AppName}-kb-service-role"
  #     AssumeRolePolicyDocument:
  #       Version: "2012-10-17"
