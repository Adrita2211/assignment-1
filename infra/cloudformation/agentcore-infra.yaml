# ecommerce-support-agent Assignment 3 infra: Bedrock AgentCore Runtime +
# Memory, and (commented out below, see "DEMO" markers) the Aurora
# Serverless v2 + pgvector cluster and Bedrock Knowledge Base that back
# retrieval and the HITL/cost-ledger persistence.
#
# Deliberate boundary, same split as infra/cloudformation/agent-infra.yaml's
# ECS stack: this template owns the AgentCore Runtime/Memory *resources*.
# It does NOT build or push the container image -- CloudFormation has no
# Docker-build capability. A CI/CD step (or `agentcore deploy`'s own
# CodeBuild path) builds the image and pushes it to ECR; ContainerImageUri
# is passed in as a parameter, same pattern as agent-infra.yaml's
# ContainerImage parameter.
#
# Real schema verified against `aws cloudformation describe-type` for
# AWS::BedrockAgentCore::Runtime and AWS::BedrockAgentCore::Memory before
# writing this -- not assumed from documentation alone.
#
# DEMO SEQUENCING: the Aurora/Knowledge Base resources are commented out by
# default so this stack can be deployed/torn down cheaply without incurring
# Aurora's continuous ACU-hour billing (see README's "provision, verify,
# tear down" cost discipline). Uncomment the block marked
# "UNCOMMENT FOR DEMO" below, fill in DbMasterPassword, and redeploy to
# bring Aurora + the Knowledge Base up. The Runtime resource references
# AuroraClusterArn/AuroraSecretArn/BedrockKnowledgeBaseId as *parameters*
# (not !Ref/!GetAtt against the commented-out resources), so uncommenting
# those resources doesn't require touching the Runtime resource at all --
# just pass the newly-created ARNs as parameter values on the next deploy.
AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Bedrock AgentCore Runtime + Memory for ecommerce-support-agent (Assignment 3).
  Aurora + Bedrock Knowledge Base are commented out by default -- see the
  DEMO SEQUENCING note above.

Parameters:
  AppName:
    Type: String
    Default: ecommerce-agent
  ContainerImageUri:
    Type: String
    Description: Full ECR image URI:tag for the AgentCore Runtime container (built and pushed by CI, not by this stack).
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: >
      Real, live-verified model ID for this deployment. NOT Claude -- this
      account has a confirmed AWS Marketplace payment-instrument block on
      Claude specifically (see README section 24); swap this parameter
      once that's resolved.
  AvpPolicyStoreId:
    Type: String
    Default: ""
    Description: Amazon Verified Permissions policy store ID (see agent/policy_boundary_avp.py). Leave blank to fall back to the hand-rolled policy boundary.
  AuroraClusterArn:
    Type: String
    Default: ""
    Description: >
      Set only once the Aurora block below is uncommented and deployed.
      Blank means HITL/cost-ledger fall back to local SQLite and KB
      retrieval falls back to local BM25 -- see agent/harness.py's backend
      factories, all of which already handle an unset/empty value.
  AuroraSecretArn:
    Type: String
    Default: ""
  BedrockKnowledgeBaseId:
    Type: String
    Default: ""
  DbMasterPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: Only required if the Aurora block below is uncommented.
  DbSubnetGroupName:
    Type: String
    Default: ""
    Description: Existing RDS subnet group. Only required if the Aurora block below is uncommented.

Conditions:
  HasAuroraCluster: !Not [!Equals [!Ref AuroraClusterArn, ""]]
  HasAvpPolicyStore: !Not [!Equals [!Ref AvpPolicyStoreId, ""]]
  HasKnowledgeBase: !Not [!Equals [!Ref BedrockKnowledgeBaseId, ""]]

Resources:
  # ---------------------------------------------------------------------
  # AgentCore Runtime execution role -- real permission set, copied from
  # this project's actual deployed role (verified via
  # `aws iam get-role-policy` against the live account before writing
  # this, not guessed), trimmed to what this specific agent's code paths
  # actually call: Bedrock model invocation (+ ApplyGuardrail), the
  # Knowledge Base Retrieve action, Aurora's RDS Data API, Verified
  # Permissions IsAuthorized, ECR pull, and CloudWatch Logs/X-Ray.
  # ---------------------------------------------------------------------
  AgentRuntimeExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AppName}-runtime-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock-agentcore.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: agent-runtime-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: BedrockModelInvocation
                Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                  - bedrock:ApplyGuardrail
                Resource:
                  - !Sub "arn:aws:bedrock:*::foundation-model/*"
                  - !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:*"
              - Sid: EcrPull
                Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: "*"
              - Sid: Xray
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"
              # Real, found-live gap: agent/memory_agentcore.py's
              # ShortTermMemoryAgentCore/LongTermMemoryAgentCore need these
              # to actually call create_event/get_last_k_turns/retrieve_memories
              # -- omitted here originally, caught by a real AccessDeniedException
              # ("... is not authorized to perform: bedrock-agentcore:ListEvents ...")
              # from an actual invocation against this CloudFormation-deployed
              # stack, not assumed from reading the SDK.
              - Sid: BedrockAgentCoreMemory
                Effect: Allow
                Action:
                  - bedrock-agentcore:CreateEvent
                  - bedrock-agentcore:GetEvent
                  - bedrock-agentcore:ListEvents
                  - bedrock-agentcore:DeleteEvent
                  - bedrock-agentcore:GetMemory
                  - bedrock-agentcore:GetMemoryRecord
                  - bedrock-agentcore:ListMemoryRecords
                  - bedrock-agentcore:DeleteMemoryRecord
                  - bedrock-agentcore:RetrieveMemoryRecords
                  - bedrock-agentcore:ListActors
                  - bedrock-agentcore:ListSessions
                Resource: !GetAtt AgentMemory.MemoryArn

  # Fn::If + AWS::NoValue only reliably omits a PROPERTY, not a list ELEMENT
  # -- using it to conditionally drop a Statement array item is a known
  # CloudFormation limitation (confirmed here via an early-validation
  # failure caught by actually running `create-change-set`, not assumed).
  # Each conditional permission set is its own AWS::IAM::Policy resource
  # instead, attached to the same role, each with a real resource-level
  # Condition -- the correct pattern for "include this whole chunk, or not".
  AuroraDataApiPolicy:
    Type: AWS::IAM::Policy
    Condition: HasAuroraCluster
    Properties:
      PolicyName: aurora-data-api-access
      Roles: [!Ref AgentRuntimeExecutionRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AuroraDataApi
            Effect: Allow
            Action:
              - rds-data:ExecuteStatement
              - rds-data:BatchExecuteStatement
              - rds:DescribeDBClusters
              - secretsmanager:GetSecretValue
            Resource: "*"

  KnowledgeBaseRetrievePolicy:
    Type: AWS::IAM::Policy
    Condition: HasKnowledgeBase
    Properties:
      PolicyName: kb-retrieve-access
      Roles: [!Ref AgentRuntimeExecutionRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: KnowledgeBaseRetrieve
            Effect: Allow
            Action: bedrock:Retrieve
            Resource: !Sub "arn:aws:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/${BedrockKnowledgeBaseId}"

  VerifiedPermissionsPolicy:
    Type: AWS::IAM::Policy
    Condition: HasAvpPolicyStore
    Properties:
      PolicyName: avp-access
      Roles: [!Ref AgentRuntimeExecutionRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: VerifiedPermissions
            Effect: Allow
            Action: verifiedpermissions:IsAuthorized
            Resource: !Sub "arn:aws:verifiedpermissions::${AWS::AccountId}:policy-store/${AvpPolicyStoreId}"

  # Real, reproducible AWS-side limitation, found here by actually running
  # `create-change-set` and bisecting the template piece by piece (not
  # assumed): AWS::BedrockAgentCore::Memory's `Name` property fails
  # CloudFormation's early-validation hook (AWS::EarlyValidation::PropertyValidation)
  # whenever it's a computed value (e.g. !Sub referencing a parameter) --
  # even though the exact same resolved string as a literal passes fine,
  # and even though AWS::BedrockAgentCore::Runtime's AgentRuntimeName
  # tolerates !Join/!Split without issue. The early-validation hook
  # apparently can't (or refuses to) statically resolve Fn::Sub for this
  # specific property and fails closed instead of skipping validation.
  # Worked around with a literal name -- if you rename AppName, update
  # these three Name/Namespaces values to match by hand.
  AgentMemory:
    Type: AWS::BedrockAgentCore::Memory
    Properties:
      Name: ecommerce_agent_memory
      Description: Short-term conversation memory + long-term SEMANTIC/SUMMARY/USER_PREFERENCE extraction (agent/memory_agentcore.py).
      EventExpiryDuration: 30
      MemoryStrategies:
        - SemanticMemoryStrategy:
            Name: ecommerce_agent_semantic
            Namespaces: ["facts/{actorId}"]
        - SummaryMemoryStrategy:
            Name: ecommerce_agent_summary
            Namespaces: ["summaries/{sessionId}"]
        - UserPreferenceMemoryStrategy:
            Name: ecommerce_agent_preferences
            Namespaces: ["prefs/{actorId}"]

  AgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: !Join ["_", !Split ["-", !Ref AppName]]
      Description: LangGraph-based e-commerce support agent (agentcore_app.py wrapping agent/harness.py's SupportHarness).
      RoleArn: !GetAtt AgentRuntimeExecutionRole.Arn
      ProtocolConfiguration: HTTP
      NetworkConfiguration:
        NetworkMode: PUBLIC
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Ref ContainerImageUri
      EnvironmentVariables:
        LLM_PROVIDER: bedrock
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        MEMORY_BACKEND: agentcore
        BEDROCK_AGENTCORE_MEMORY_ID: !GetAtt AgentMemory.MemoryId
        POLICY_BOUNDARY_BACKEND: !If [HasAvpPolicyStore, avp, hand_rolled]
        AVP_POLICY_STORE_ID: !Ref AvpPolicyStoreId
        HITL_BACKEND: !If [HasAuroraCluster, aurora, sqlite]
        COST_LEDGER_BACKEND: !If [HasAuroraCluster, aurora, sqlite]
        AURORA_CLUSTER_ARN: !Ref AuroraClusterArn
        AURORA_SECRET_ARN: !Ref AuroraSecretArn
        AURORA_DATABASE: kbdb
        BEDROCK_KNOWLEDGE_BASE_ID: !Ref BedrockKnowledgeBaseId

  # =======================================================================
  # UNCOMMENT FOR DEMO -- Aurora Serverless v2 + pgvector + Bedrock
  # Knowledge Base. Mirrors infra/create_kb_aurora.sh exactly, as real
  # CloudFormation resources instead of imperative CLI calls.
  #
  # After uncommenting: fill in DbMasterPassword and DbSubnetGroupName
  # params, deploy, then take the outputs (AuroraClusterArnOut,
  # AuroraSecretArnOut, KnowledgeBaseIdOut) and redeploy this SAME stack
  # passing them back in as AuroraClusterArn/AuroraSecretArn/
  # BedrockKnowledgeBaseId -- the Runtime resource picks them up via the
  # Conditions above with no other changes needed.
  #
  # Note: the pgvector schema itself (CREATE EXTENSION vector; the
  # bedrock_integration.bedrock_kb table; its HNSW + full-text indexes)
  # still needs to run via the RDS Data API after the cluster exists --
  # CloudFormation has no "run this SQL" primitive. See
  # infra/create_kb_aurora.sh's `run_sql` calls for the exact statements,
  # or wire a Custom::Resource backed by a small Lambda if you want this
  # fully declarative too.
  # =======================================================================

  # AuroraCluster:
  #   Type: AWS::RDS::DBCluster
  #   Properties:
  #     DBClusterIdentifier: !Sub "${AppName}-kb-aurora"
