Outputs:
  AgentRuntimeArn:
    Value: !GetAtt AgentRuntime.AgentRuntimeArn
  AgentMemoryId:
    Value: !GetAtt AgentMemory.MemoryId
  # AuroraClusterArnOut:
  #   Value: !GetAtt AuroraCluster.DBClusterArn
  # AuroraSecretArnOut:
  #   Value: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
  # KnowledgeBaseIdOut:
